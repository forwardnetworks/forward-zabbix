[project]
name = "fwdzbx"
version = "0.1.0"
description = "Field integration between Forward Networks and Zabbix: inventory sync and a monitoring coverage-gap report"
authors = [
    { name = "craigjohnson", email = "craigjohnson@forwardnetworks.com" }
]
requires-python = ">=3.12"
dependencies = [
    "forward-sdk>=0.1.26",
    "zabbix-utils>=2.0.4",
]

[project.scripts]
fwdzbx = "fwdzbx:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
