zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 07d84969adc24ee0aefae16b3d23d3ab
      name: Templates/Network devices
  templates:
    - uuid: c9971995084540269a923cf9e75c66c3
      template: Forward Performance by SNMP
      name: Forward Performance by SNMP
      description: |
        Raw counters for feeding Forward's performance views, read in one SNMP walk per cycle so every value of a
        cycle shares one timestamp. Counters are stored as polled (no change-per-second), because Forward computes
        rates itself and a stored rate loses small error and discard counts. Link it in addition to, or instead of,
        the stock "Network Generic Device by SNMP" template. Needs the host's {$SNMP_COMMUNITY} macro and an SNMP interface.
      groups:
        - name: Templates/Network devices
      items:
        - uuid: 2f9c4f3d2636430cb00c4f3670e4ed64
          name: 'Forward perf: uptime'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: fwd.uptime
          delay: '{$FWD.PERF.INTERVAL}'
          history: 7d
          trends: '0'
          units: s
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: 7214dfd781a34a4aa5e683b14851e882
          name: 'Forward perf: interface counters walk'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.20,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.31.1.1.1.15,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.25.3.3.1.2,1.3.6.1.2.1.25.2.3.1.3,1.3.6.1.2.1.25.2.3.1.4,1.3.6.1.2.1.25.2.3.1.5,1.3.6.1.2.1.25.2.3.1.6]'
          key: fwd.if.walk
          delay: '{$FWD.PERF.INTERVAL}'
          history: '0'
          trends: '0'
          value_type: TEXT
          tags:
            - tag: component
              value: network
      discovery_rules:
        - uuid: 2ef89dc213a64ba39568ca5ddb840684
          name: 'Forward perf: interface discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: fwd.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$FWD.PERF.IFNAME.MATCHES}'
                formulaid: A
              - macro: '{#IFNAME}'
                value: '{$FWD.PERF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: eeca87a447f7473a93cd0ef4428bcb6a
              name: 'Forward perf: interface {#IFNAME}: Inbound octets (ifHCInOctets)'
              type: DEPENDENT
              key: 'fwd.if.in.octets[{#IFNAME}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: e5160ba1ad0148079c0ea61e19812ecb
              name: 'Forward perf: interface {#IFNAME}: Outbound octets (ifHCOutOctets)'
              type: DEPENDENT
              key: 'fwd.if.out.octets[{#IFNAME}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3af6cf882a334735ab951875e173b41f
              name: 'Forward perf: interface {#IFNAME}: Inbound packets with errors'
              type: DEPENDENT
              key: 'fwd.if.in.errors[{#IFNAME}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 437b98119dc4408a8fd0632e556f4405
              name: 'Forward perf: interface {#IFNAME}: Outbound packets with errors'
              type: DEPENDENT
              key: 'fwd.if.out.errors[{#IFNAME}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 63b2e02955254c239bd38da25bdae9e6
              name: 'Forward perf: interface {#IFNAME}: Inbound packets discarded'
              type: DEPENDENT
              key: 'fwd.if.in.discards[{#IFNAME}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 34767db7f5d04c21ab8d70b9e13d0bcb
              name: 'Forward perf: interface {#IFNAME}: Outbound packets discarded'
              type: DEPENDENT
              key: 'fwd.if.out.discards[{#IFNAME}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 2b29f05e011a4d7bb8f509149f8fd6f5
              name: 'Forward perf: interface {#IFNAME}: Speed (ifHighSpeed, Mbit/s)'
              type: DEPENDENT
              key: 'fwd.if.speed[{#IFNAME}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3de5d3085fac490a9090d8c784961b41
              name: 'Forward perf: interface {#IFNAME}: Type (ifType)'
              type: DEPENDENT
              key: 'fwd.if.type[{#IFNAME}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
        - uuid: 0b7de58be73d43fdbe94ab26dd0492fc
          name: 'Forward perf: CPU discovery (HOST-RESOURCES-MIB)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#HRCPU},1.3.6.1.2.1.25.3.3.1.2]'
          key: fwd.cpu.discovery
          delay: 1h
          description: One row per processor core; Forward gets the average. Devices without HOST-RESOURCES-MIB simply discover nothing.
          item_prototypes:
            - uuid: 2a4ceb23711445de81885c0f6f303343
              name: 'Forward perf: CPU core {#SNMPINDEX} load, %'
              type: DEPENDENT
              key: 'fwd.cpu.core[{#SNMPINDEX}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              units: '%'
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: cpu
        - uuid: 1ef87d4bfd504cc1ac72b4f8b976869a
          name: 'Forward perf: memory discovery (HOST-RESOURCES-MIB)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#HRDESCR},1.3.6.1.2.1.25.2.3.1.3]'
          key: fwd.mem.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#HRDESCR}'
                value: '{$FWD.PERF.MEM.MATCHES}'
                formulaid: A
          description: The storage rows that describe RAM, and the buffer and cache rows that are subtracted from it.
          item_prototypes:
            - uuid: 77c06af2d368454fb515465eba5ad666
              name: 'Forward perf: storage {#HRDESCR}: allocation unit, bytes'
              type: DEPENDENT
              key: 'fwd.mem.unit[{#HRDESCR}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.25.2.3.1.4.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: memory
            - uuid: 75249e9448bd4ef196b03b6d4fd10732
              name: 'Forward perf: storage {#HRDESCR}: size, units'
              type: DEPENDENT
              key: 'fwd.mem.size[{#HRDESCR}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.25.2.3.1.5.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: memory
            - uuid: a93b95803574468796fb26f83d7d7716
              name: 'Forward perf: storage {#HRDESCR}: used, units'
              type: DEPENDENT
              key: 'fwd.mem.used[{#HRDESCR}]'
              delay: '0'
              value_type: UNSIGNED
              history: 7d
              trends: '0'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.25.2.3.1.6.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: fwd.if.walk
              tags:
                - tag: component
                  value: memory
      macros:
        - macro: '{$FWD.PERF.IFNAME.MATCHES}'
          value: '.*'
          description: Interfaces to send to Forward (regular expression on the interface name).
        - macro: '{$FWD.PERF.IFNAME.NOT_MATCHES}'
          value: '^(Null|Loopback|lo$)'
          description: Interfaces to leave out.
        - macro: '{$FWD.PERF.INTERVAL}'
          value: 5m
          description: How often to poll. Forward's own collector defaults to 5 minutes.
        - macro: '{$FWD.PERF.MEM.MATCHES}'
          value: '^(RAM|Physical memory|Memory)'
          description: Storage rows to read as memory (regular expression on hrStorageDescr). RAM, buffer and cache rows of Linux-based network operating systems all start with RAM.
